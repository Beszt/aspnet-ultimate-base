name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AspNetUltimateBase.sln

      - name: Build (Release)
        run: dotnet build AspNetUltimateBase.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AspNetUltimateBase.sln --configuration Release --no-build
